<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:589px;height:764px;background:#FFFFFF;" width="589px" height="764px" viewBox="0 0 589 764" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="293.656" cy="25" rx="10" ry="10" fill="#000" style="stroke:#222;stroke-width:1;"/><rect x="17.956" y="55" width="551.401" height="38.949" fill="#FFFFE6" style="stroke:#8C7B3E;stroke-width:1.2;" rx="6" ry="6"/><text x="29.956" y="79.194" fill="#000" font-size="13" textLength="527.401" font-family="Arial">calculatePayroll(nhân viên, tháng, năm) — Lấy hợp đồng hiệu lực (baseSalary, allowances)</text><rect x="131.833" y="113.949" width="323.647" height="38.949" fill="#FFFFE6" style="stroke:#8C7B3E;stroke-width:1.2;" rx="6" ry="6"/><text x="143.833" y="138.143" fill="#000" font-size="13" textLength="299.647" font-family="Arial">Ngày công chuẩn = thứ Hai đến thứ Sáu trừ ngày lễ</text><rect x="87.853" y="172.897" width="411.607" height="53.897" fill="#FFFFE6" style="stroke:#8C7B3E;stroke-width:1.2;" rx="6" ry="6"/><text x="99.853" y="197.091" fill="#000" font-size="13" textLength="387.607" font-family="Arial">Ngày công thực tế = min(ngày công chuẩn, workDays ngày thường</text><text x="99.853" y="212.04" fill="#000" font-size="13" textLength="329.215" font-family="Arial">+ ngày phép năm/công tác đã duyệt chưa có chấm công)</text><rect x="59.387" y="246.795" width="468.539" height="53.897" fill="#FFFFE6" style="stroke:#8C7B3E;stroke-width:1.2;" rx="6" ry="6"/><text x="71.387" y="270.989" fill="#000" font-size="13" textLength="444.539" font-family="Arial">Giờ làm thêm theo dayType (×1,5 ngày thường, ×2,0 cuối tuần, ×3,0 ngày lễ)</text><text x="71.387" y="285.938" fill="#000" font-size="13" textLength="414.616" font-family="Arial">→ Thu nhập gộp = lương theo ngày công + phụ cấp + tiền OT + thưởng</text><polygon points="220.502,320.692,366.81,320.692,378.81,332.692,366.81,344.692,220.502,344.692,208.502,332.692,220.502,320.692" fill="#FFFFE6" style="stroke:#8C7B3E;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="222.502" y="337.412" fill="#000" font-size="13" textLength="142.308" font-family="Arial">Ngày công thực tế ≥ 14?</text><text x="193.828" y="328.149" fill="#000" font-size="12" textLength="12.674" font-family="Arial">có</text><text x="380.81" y="328.149" fill="#000" font-size="12" textLength="32.695" font-family="Arial">không</text><rect x="16" y="354.692" width="307.683" height="53.897" fill="#FFFFE6" style="stroke:#8C7B3E;stroke-width:1.2;" rx="6" ry="6"/><text x="28" y="378.886" fill="#000" font-size="13" textLength="198.669" font-family="Arial">BHXH 8%, BHYT 1,5%, BHTN 1%</text><text x="28" y="393.835" fill="#000" font-size="13" textLength="283.683" font-family="Arial">trên min(lương hợp đồng, trần 20 × lương cơ sở)</text><rect x="343.683" y="354.692" width="147.576" height="38.949" fill="#FFFFE6" style="stroke:#8C7B3E;stroke-width:1.2;" rx="6" ry="6"/><text x="355.683" y="378.886" fill="#000" font-size="13" textLength="123.576" font-family="Arial">Không trích bảo hiểm</text><polygon points="293.656,418.59,305.656,430.59,293.656,442.59,281.656,430.59,293.656,418.59" fill="#FFFFE6" style="stroke:#8C7B3E;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="154.335" y="462.59" width="278.643" height="53.897" fill="#FFFFE6" style="stroke:#8C7B3E;stroke-width:1.2;" rx="6" ry="6"/><text x="166.335" y="486.784" fill="#000" font-size="13" textLength="213.941" font-family="Arial">Thu nhập tính thuế = gộp − bảo hiểm</text><text x="166.335" y="501.732" fill="#000" font-size="13" textLength="254.643" font-family="Arial">− 15,5 triệu − 6,2 triệu × số người phụ thuộc</text><polygon points="212.999,536.487,374.313,536.487,386.313,548.487,374.313,560.487,212.999,560.487,200.999,548.487,212.999,536.487" fill="#FFFFE6" style="stroke:#8C7B3E;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="214.999" y="553.207" fill="#000" font-size="13" textLength="157.314" font-family="Arial">Kỳ lương trước 01/7/2026?</text><text x="186.326" y="543.944" fill="#000" font-size="12" textLength="12.674" font-family="Arial">có</text><text x="388.313" y="543.944" fill="#000" font-size="12" textLength="32.695" font-family="Arial">không</text><rect x="125.882" y="570.487" width="130.234" height="38.949" fill="#FFFFE6" style="stroke:#8C7B3E;stroke-width:1.2;" rx="6" ry="6"/><text x="137.882" y="594.681" fill="#000" font-size="13" textLength="106.234" font-family="Arial">Biểu lũy tiến 7 bậc</text><rect x="331.196" y="570.487" width="130.234" height="38.949" fill="#FFFFE6" style="stroke:#8C7B3E;stroke-width:1.2;" rx="6" ry="6"/><text x="343.196" y="594.681" fill="#000" font-size="13" textLength="106.234" font-family="Arial">Biểu lũy tiến 5 bậc</text><polygon points="293.656,619.436,305.656,631.436,293.656,643.436,281.656,631.436,293.656,619.436" fill="#FFFFE6" style="stroke:#8C7B3E;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="150.095" y="663.436" width="287.123" height="38.949" fill="#FFFFE6" style="stroke:#8C7B3E;stroke-width:1.2;" rx="6" ry="6"/><text x="162.095" y="687.63" fill="#000" font-size="13" textLength="263.123" font-family="Arial">Thực lĩnh = gộp − bảo hiểm − thuế − tạm ứng</text><ellipse cx="293.656" cy="733.385" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="293.656" cy="733.385" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="293.656" y1="35" x2="293.656" y2="55" style="stroke:#333;stroke-width:1.2;"/><polygon points="289.656,45,293.656,55,297.656,45,293.656,49" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="293.656" y1="93.949" x2="293.656" y2="113.949" style="stroke:#333;stroke-width:1.2;"/><polygon points="289.656,103.949,293.